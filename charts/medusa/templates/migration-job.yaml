{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "medusa.fullname" . }}-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    {{- if .Values.migrations.hook }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: {{ .Values.migrations.hookDeletePolicy | quote }}
    {{- end }}
  labels:
    {{- include "medusa.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "medusa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "medusa.secretName" . }}
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.postgres.name }} -p {{ .Values.postgres.port }} -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}; do
                sleep 2
              done
        - name: wait-for-redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: {{ .Values.images.redis.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ .Values.redis.name }} -p {{ .Values.redis.port }} ping; do
                sleep 2
              done
      containers:
        - name: migrate
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - sh
            - -lc
          args:
            - |
              set -e
              /server/apps/backend/node_modules/.bin/medusa db:migrate
              {{- if .Values.migrations.seed.enabled }}
              /server/apps/backend/node_modules/.bin/medusa exec {{ .Values.migrations.seed.script }}
              {{- end }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "medusa.fullname" . }}-config
                  key: NODE_ENV
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "medusa.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ include "medusa.databaseUrl" . | quote }}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "medusa.fullname" . }}-config
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "medusa.secretName" . }}
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "medusa.secretName" . }}
                  key: COOKIE_SECRET
            - name: MEDUSA_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "medusa.secretName" . }}
                  key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
                  optional: true
            - name: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "medusa.secretName" . }}
                  key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
                  optional: true
            - name: STORE_CORS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "medusa.fullname" . }}-config
                  key: STORE_CORS
            - name: ADMIN_CORS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "medusa.fullname" . }}-config
                  key: ADMIN_CORS
            - name: AUTH_CORS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "medusa.fullname" . }}-config
                  key: AUTH_CORS
            - name: MEDUSA_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "medusa.fullname" . }}-config
                  key: MEDUSA_BACKEND_URL
            - name: MEDUSA_WORKER_MODE
              value: "server"
            - name: DISABLE_MEDUSA_ADMIN
              value: "true"
{{- end }}

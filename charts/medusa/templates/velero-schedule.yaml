{{- if .Values.backup.enabled }}
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: {{ include "medusa.fullname" . }}-backup-schedule
  namespace: {{ .Values.backup.veleroNamespace | default "velero" }}
  labels:
    {{- include "medusa.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  template:
    ttl: {{ .Values.backup.ttl | quote }}
    storageLocation: {{ .Values.backup.storageLocation | quote }}
    includedNamespaces:
      - {{ .Values.namespace }}
    snapshotVolumes: {{ .Values.backup.snapshotVolumes }}
{{- end }}
